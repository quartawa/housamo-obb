name: Publish OBB releases

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: publish-obb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish original OBB assets
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const tag = context.ref.slice('refs/tags/'.length);
            const files = fs.readdirSync('.').flatMap(name => {
              const match = /^main\.(\d+)\.jp\.co\.lifewonders\.housamo\.obb$/.exec(name);
              return match && fs.statSync(name).isFile()
                ? [{ name, version: match[1] }] : [];
            });
            if (!files.length) {
              throw new Error(`标签 ${tag} 的仓库根目录没有 OBB 文件`);
            }
            files.sort((a, b) => a.version.localeCompare(b.version, 'en', { numeric: true }));
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100
            });
            let release = releases.find(item => item.tag_name === tag);
            if (!release) {
              ({ data: release } = await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: tag,
                body: `Housamo ${tag} 原始 OBB 资源。下载后保留文件名，不要解压。`,
                draft: true,
                make_latest: 'false'
              }));
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id, per_page: 100
            });
            for (const file of files) {
              const existing = assets.find(asset => asset.name === file.name);
              if (existing && existing.state !== 'uploaded') {
                throw new Error(`${file.name} 的附件上传未完成，请删除该不完整附件后重跑`);
              }
              if (!existing) {
                const data = fs.readFileSync(file.name);
                await github.rest.repos.uploadReleaseAsset({
                  owner, repo, release_id: release.id,
                  name: file.name,
                  headers: {
                    'content-type': 'application/octet-stream',
                    'content-length': data.length
                  },
                  data
                });
                core.info(`已上传 ${file.name}`);
              } else {
                core.info(`附件已存在，跳过 ${file.name}`);
              }
              await core.summary.addRaw(`- ${tag}：[${file.name}](${context.serverUrl}/${owner}/${repo}/releases/download/${encodeURIComponent(tag)}/${file.name})\n`).write();
            }
            if (release.draft) {
              await github.rest.repos.updateRelease({
                owner, repo, release_id: release.id,
                draft: false, make_latest: 'false'
              });
            }
